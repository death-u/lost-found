{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Found Item | Campus Lost & Found</title>
    <!-- Tailwind CSS v4 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="{% static 'styles/found_items.css' %}">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-slate-50 flex justify-center items-center min-h-screen text-slate-800 py-10">
    
    <div class="w-[90%] sm:w-[80%] max-w-2xl flex flex-col items-center justify-center">
        
        <!-- Header Bar -->
        <div class="w-full bg-white border border-slate-200/80 shadow-sm h-[70px] flex justify-start items-center px-4 rounded-2xl gap-4 mb-6">
            <img src="{% static 'images/logo/logo.png' %}" alt="Campus Lost & Found Logo" class="h-12 w-12 rounded-xl object-cover bg-slate-100">
            <h1 class="font-bold text-slate-800 leading-tight text-sm tracking-wide">
                CAMPUS <br><span class="text-indigo-600 uppercase">Lost & Found</span>
            </h1>
        </div>

        <!-- Main Form & Dropzone Card -->
        <form method="POST" action="" enctype="multipart/form-data" class="w-full bg-white border border-slate-200/80 p-6 rounded-2xl shadow-sm flex flex-col gap-5">
            {% csrf_token %}
            <input type="hidden" id="ai_data" name="ai_data" value="{}">
            <div class="border-b border-slate-100 pb-3 flex justify-between items-end">
                <div>
                    <h2 class="text-xl font-bold text-slate-800">Report a Found Item</h2>
                    <p class="text-xs text-slate-500 mt-1">Upload a photo—AI will automatically fill in the title and category!</p>
                </div>
            </div>

            <!-- Drag & Drop File Upload Area -->
            <div class="flex flex-col gap-1.5">
                <label class="block text-xs font-bold uppercase text-slate-600 tracking-wider">Upload Item Photo</label>
                
                <div class="relative w-full">
                    <label id="dropzone" for="dropzone-file" class="flex flex-col items-center justify-center w-full min-h-[220px] border-2 border-dashed border-slate-300 rounded-xl cursor-pointer bg-slate-50/50 hover:bg-indigo-50/40 hover:border-indigo-400 transition-all duration-200 relative overflow-hidden">
                        
                        <!-- Initial Prompt View (pointer-events-none prevents child event flickering) -->
                        <div id="dropzone-prompt" class="pointer-events-none flex flex-col items-center justify-center py-6 px-4 text-center">
                            <div class="p-3 bg-indigo-50 text-indigo-600 rounded-full mb-3">
                                <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5m-13.5-9L12 3m0 0l4.5 4.5M12 3v13.5"></path>
                                </svg>
                            </div>
                            <p class="mb-1 text-sm font-medium text-slate-700">
                                <span class="font-semibold text-indigo-600 hover:underline">Click to upload photo</span> or drag & drop here
                            </p>
                            <p class="text-xs text-slate-400">PNG, JPG, or WEBP (AI auto-analyzes item details)</p>
                        </div>

                        <!-- Image Preview & AI Overlay -->
                        <div id="file-preview" class="hidden flex-col items-center justify-center p-4 w-full h-full relative z-10">
                            <img id="preview-img" src="#" alt="Preview" class="max-h-48 rounded-lg object-contain shadow-sm border border-slate-200 mb-2">
                            <p id="file-name" class="text-xs font-semibold text-slate-600 truncate max-w-[250px]"></p>
                            
                            <button type="button" id="remove-file-btn" class="mt-2 text-xs text-red-500 hover:text-red-700 font-medium underline cursor-pointer">
                                Remove & Change Photo
                            </button>
                        </div>

                        <!-- AI Scanning Animation Overlay -->
                        <div id="ai-scanner" class="hidden absolute inset-0 bg-slate-900/60 backdrop-blur-xs flex flex-col items-center justify-center text-white gap-2 z-20">
                            <div class="w-8 h-8 border-3 border-white border-t-transparent rounded-full animate-spin"></div>
                            <p class="text-xs font-semibold tracking-wide animate-pulse"> AI Analyzing Photo...</p>
                        </div>

                        <input id="dropzone-file" name="item_image" type="file" class="hidden" accept="image/*" required />
                    </label>
                </div>
            </div>

            <!-- AI Output Fields (Auto-Filled, Freeform Text Inputs) -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 bg-indigo-50/30 p-4 rounded-xl border border-indigo-100">
                <div>
                    <div class="flex items-center justify-between mb-1">
                        <label for="title" class="block text-xs font-semibold text-slate-700">Item Title</label>
                        <span id="ai-badge-title" class="hidden text-[10px] font-bold bg-indigo-100 text-indigo-700 px-2 py-0.5 rounded-full"> AI Detected</span>
                    </div>
                    <input type="text" id="title" name="title" placeholder="Upload image to auto-detect title" required class="w-full px-3 py-2 text-sm bg-white border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition">
                </div>
                
                <div>
                    <div class="flex items-center justify-between mb-1">
                        <label for="category" class="block text-xs font-semibold text-slate-700">Category</label>
                        <span id="ai-badge-category" class="hidden text-[10px] font-bold bg-indigo-100 text-indigo-700 px-2 py-0.5 rounded-full"> AI Detected</span>
                    </div>
                    <!-- Freeform Category Input with Suggested Options -->
                    <input type="text" id="category" name="category" list="category-suggestions" placeholder="e.g., Backpack, Cloth, Electronics..." required class="w-full px-3 py-2 text-sm bg-white border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition">
                    
                    <datalist id="category-suggestions">
                        <option value="Bags & Backpacks">
                        <option value="Clothing & Jackets">
                        <option value="Electronics & Phones">
                        <option value="Water Bottles & Flasks">
                        <option value="IDs, Cards & Wallets">
                        <option value="Keys & Lanyards">
                        <option value="Books & Stationery">
                    </datalist>
                </div>
            </div>

            <!-- User Specific Fields -->
            <div class="flex flex-col gap-4">
                <div>
                    <label for="location" class="block text-xs font-semibold text-slate-700 mb-1">Where was it found? <span class="text-red-500">*</span></label>
                    <input type="text" id="location" name="location" placeholder="e.g., Library 2nd Floor, Science Lab, Hall B" required class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition">
                </div>

                <div>
                    <label for="description" class="block text-xs font-semibold text-slate-700 mb-1">Additional Notes <span class="text-slate-400 font-normal">(Optional)</span></label>
                    <textarea id="description" name="description" rows="3" placeholder="Any specific details, color, brand name, or where you deposited it (e.g., left with Campus Security)..." class="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition resize-none"></textarea>
                </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-semibold rounded-xl shadow-sm transition text-sm flex items-center justify-center gap-2 cursor-pointer mt-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"></path></svg>
                Post Found Item
            </button>
        </form>

    </div>

    <!-- External JavaScript -->
    <script src="{% static 'js/found_items.js' %}"></script>
    <!-- imline script -->
     <script>
        {% if messages %}
            {% for message in messages %}
                {% if message.tags == 'error' %}
                    Swal.fire({
                        icon: 'error',
                        title: 'Error',
                        text: '{{ message }}',
                        confirmButtonColor: '#4F46E5'
                    });
                {% elif message.tags == 'success' %}
                    Swal.fire({
                        icon: 'success',
                        title: 'Success',
                        text: '{{ message }}',
                        confirmButtonColor: '#4F46E5'
                    });
                {% endif %}
            {% endfor %}
        {% endif %}
     </script>
</body>
</html>
